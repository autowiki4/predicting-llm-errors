# Real experiment with Claude through the Anthropic API.
#   export ANTHROPIC_API_KEY=...        (never put the key in this file)
#   llmrel estimate --config configs/claude.yaml   # check the number of calls first
#   llmrel run --config configs/claude.yaml
#
# Cost: each question makes 1 + n_samples + 1 calls (7 with the defaults), so
# 1,000 questions = 7,000 calls. Try --set data.n_questions=20 first.
# Tip: the experiment needs enough WRONG answers to learn from (aim for 10-40%).
# A very strong model may be right ~95%+ of the time on GSM8K; if so, lower
# `effort`, try a smaller model, or use a harder dataset.
run_name: claude
output_dir: runs

data:
  path: data/raw/gsm8k_test.jsonl
  n_questions: 1000
  seed: 0

llm:
  provider: anthropic
  model: claude-opus-5-5
  max_tokens: 16000
  effort: medium         # low | medium | high | xhigh | max
  fallbacks: auto        # server-side refusal fallbacks where the model supports them

collection:
  n_samples: 5
  self_check: true
  workers: 4             # parallel requests; lower this if you hit rate limits

eval:
  test_size: 0.25
  cv_folds: 5
  seed: 42
  models: [logistic_regression, random_forest, gradient_boosting]
  n_bootstrap: 1000
  n_permutations: 1000
  ablation_model: logistic_regression
