# Offline demo: uses the built-in SIMULATED LLM, so it needs no API key and no
# network. It proves the pipeline runs end to end. Its numbers are NOT evidence
# about real LLMs (the report says so in a banner).
run_name: demo
output_dir: runs

data:
  path: data/raw/gsm8k_test.jsonl
  n_questions: 1000      # proposal: "roughly 1,000-3,000 questions"
  seed: 0

llm:
  provider: simulated
  model: simulated-llm

collection:
  n_samples: 5           # extra answers per question -> consistency features
  self_check: true       # ask the model to grade its own answer
  workers: 8

eval:
  test_size: 0.25
  cv_folds: 5
  seed: 42
  models: [logistic_regression, random_forest, gradient_boosting]
  n_bootstrap: 1000
  n_permutations: 1000
  ablation_model: logistic_regression
